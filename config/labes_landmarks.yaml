# Hold-out landmark reference points for the LABES rigor checks (#3).
# 25 reference points spanning the six biogeographic regions of Switzerland.
# Each landmark has an expected qualitative outcome on selected indicators that we
# can validate against (e.g., Zürich HB should have high settlement %, near-zero
# forest %, high light emissions; Aletschgletscher should have near-zero settlement
# and very low remoteness-accessibility).
#
# Coordinates in EPSG:4326 (lon,lat); enrichment uses EPSG:2056 LV95 internally.

landmarks:

  # --- Mittelland (urban cores + agricultural plateau) ---
  - id: zurich_hb
    name: "Zürich Hauptbahnhof"
    biogeoregion: mittelland
    lon: 8.5403
    lat: 47.3779
    expectations:
      labes_ind36_zersiedlung_wup: ">national_mean"
      labes_ind14_licht: ">national_p90"
      labes_ind_neu2_abgeschiedenheit: "<10"
      labes_ind24_landschaftsschoenheit: "<4.10"

  - id: bern_zentrum
    name: "Bundesplatz Bern"
    biogeoregion: mittelland
    lon: 7.4446
    lat: 46.9466

  - id: lausanne_centre
    name: "Lausanne — Place St-François"
    biogeoregion: mittelland
    lon: 6.6323
    lat: 46.5197

  - id: basel_marktplatz
