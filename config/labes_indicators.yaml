# LABES indicator specification — single source of truth for labes_enrich.
#
# Naming convention (see project memory: project-labes-schema-decision):
#   column_name: labes_ind<N>_<german_slug>   (e.g. labes_ind1_wald)
#   sub-letter:  labes_ind<N><a/b>_<slug>     (e.g. labes_ind11a_veraenderung_fliessgewaesser)
#   NEU:         labes_ind_neu<N>_<slug>      (e.g. labes_ind_neu2_abgeschiedenheit)
#
# join_method dispatch (handled by graph_pipeline/labes_joins.py):
#   social_csv_municipality       — read LABES_Rep_2020.csv, aggregate by Gemnr,
#                                   municipality-polygon join to manifest.
#   polygon_municipality_field    — gpd.read_file(.gdb|.shp) for a municipality
#                                   polygon layer, point-in-polygon at LV95.
#   polygon_biogeoregion_field    — same idea, biogeoregion-level polygon source.
#   polygon_cell_field            — fine polygon coverage (no admin-unit semantics).
#   raster_point_sample           — rasterio open, sample value at each LV95 point.
#   xlsx_biogeoregion_via_polygon — read a per-biogeoregion XLSX, biogeoregion
#                                   polygon join.
#   xlsx_municipality_via_polygon — same idea, municipality XLSX.
#   xlsx_national_constant        — only a national scalar; emitted as constant
#                                   column. Low signal; included for completeness.
#   sample_based_biogeoregion     — indicator value derived from BAFU's monitoring
#                                   samples; only biogeoregion aggregate published.
#
# granularity:
#   raster_pixel        — true per-image variation
#   polygon_cell        — fine polygon coverage; per-image variation
#   municipality        — ~2,200 unique values across CH
#   biogeoregion        — 6 unique values
#   national            — 1 value (effectively constant)
#
# implementation_status: to_implement | implemented | validated | blocked
# reference_values are extracted from the per-indicator Auswertungsprotokoll PDF
# and filled in as each indicator is wired (latest BAFU report year).

target_crs: EPSG:2056
manifest_xy_columns: [lv95_easting, lv95_northing]
manifest_key: global_index

biogeoregion_keys:
  jura: 1
  mittelland: 2
  alpennordflanke: 3
  westliche_zentralalpen: 4
  oestliche_zentralalpen: 5
  alpensuedflanke: 6

indicators:

  # ============================================================
  # PHYSICAL INDICATORS (BAFU numbered 1..36, plus NEU)
  # ============================================================

  - ind_id: "1"
    column_name: labes_ind1_wald
    category: physical
    german_name: "Wald"
    english_description: |
      Forest area as percent of land surface, sampled at 100m (1 ha) from the
      official BFS Arealstatistik point lattice (`ch.bfs.arealstatistik`,
      EPSG:2056). Forest is classified as NOAS04 classes 50..57 (BAFU protocol).
      Values are emitted as 0 or 100 (percent) per sampled point.
    bafu_pdf: geodata/LABES/labes_1_wald/Auswertungsprotokoll_LABES_1_Wald.pdf
    source:
      kind: bfs_arealstatistik_point_csv
      path: geodata/external/arealstatistik/arealstatistik_2056.csv.zip
      easting_column: E_COORD
      northing_column: N_COORD
      class_column: AS_72
      class_set: [50, 51, 52, 53, 54, 55, 56, 57]
      grid_size_m: 100
      value_scale: 100
      note: "Official source resolved from geo.admin STAC item ch.bfs.arealstatistik/arealstatistik."
    join_method: arealstatistik_point_sample
    granularity: raster_pixel
    value_unit: pct
    value_range: [0, 100]
    year_latest: 2018
    reference_values:
      national_mean: 29.5
      biogeoregion_means:
        jura: 44.3
        mittelland: 23.1
        alpennordflanke: 31.5
        westliche_zentralalpen: 21.2
        oestliche_zentralalpen: 22.5
        alpensuedflanke: 47.4
    implementation_status: implemented

  - ind_id: "2"
    column_name: labes_ind2_veraenderung_lw_flaeche
    category: physical
    german_name: "Veränderung Landwirtschaftsfläche"
    english_description: "Change in agricultural land area per biogeoregion (Teilraum), comparing successive Arealstatistik survey periods."
    bafu_pdf: geodata/LABES/labes_2_veraenderung_lw_flaeche/Auswertungsprotokoll_LABES_2_Veraenderung_LW_Flaeche.pdf
    source:
      kind: xlsx_biogeoregion
      path: geodata/LABES/labes_2_veraenderung_lw_flaeche/LABES_2_Results/data_tab_1_1a_auswertungsprotokoll.xlsx
      sheet: Tab 1
      header_row: 0
      teilraum_column: Teilraum
      value_column: 2013/18
    join_method: xlsx_biogeoregion_via_polygon
    granularity: biogeoregion
    value_unit: thousand_ha
    value_range: [0, null]
    year_latest: 2018
    reference_values:
      national_mean: null
      biogeoregion_means:
        jura: 141.103
        mittelland: 539.638
        alpennordflanke: 199.231
        westliche_zentralalpen: 26.017
        oestliche_zentralalpen: 30.098
        alpensuedflanke: 13.006
    implementation_status: implemented

  - ind_id: "2a"
    column_name: labes_ind2a_nutzungsvielfalt_lw
    category: physical
    german_name: "Nutzungsvielfalt in der Landwirtschaftsfläche"
    english_description: "Diversity of agricultural land use per municipality (number of distinct use categories, mean over hectare raster cells), 2018."
    bafu_pdf: geodata/LABES/labes_2a_nutzungsvielfalt_in_der_lw_flaeche/Auswertungsprotokoll_LABES_2a_Nutzungsvielfalt_in_der_LW_Flaeche.pdf
    source:
      kind: shapefile_municipality
      path: geodata/LABES/labes_2a_nutzungsvielfalt_in_der_lw_flaeche/LABES_2a_GIS/LABES_2a_Nutzungsvielfalt_in_der_LW_Flaeche_shapes/karte_lw_2018t.shp
      bfs_column: bfs_nummer
      value_column: DURCHSCHNI
    join_method: polygon_municipality_field
    granularity: municipality
    value_unit: count
    value_range: [0, null]
    year_latest: 2018
    reference_values:
      national_mean: null
      biogeoregion_means: null
    implementation_status: implemented

  - ind_id: "3"
    column_name: labes_ind3_flaechenverbrauch_siedlung
    category: physical
    german_name: "Flächenverbrauch Siedlung"
    english_description: |
      Settlement land use — per-pixel BINARY MASK (1=pixel is settlement,
      0=not settlement) derived from BAFU's NOAS04 land-use code raster at
      100m LV95. Settlement classes were calibrated empirically against
      BAFU's published per-biogeoregion settlement-area totals (k_ha,
      2004/09 Arealstatistik). Best-fit class set: NOAS04 codes
      {11, 12, 13, 15, 16, 17}, agreement ±6.4% per biogeoregion. The
      NOAS04 raster was extracted from labes_7_versiegelung/.../
      LABES_7_Versiegelung_1318_raster_update via scripts/extract_labes_rasters.py
      (subdataset is the NOAS04 land-use code input to BAFU's sealing
      product). Calibration script: scripts/calibrate_noas04_classes.py.
    bafu_pdf: geodata/LABES/labes_3_flaechenverbrauch_siedlung/Auswertungsprotokoll_LABES_3_Flaechenverbrauch_siedlung.pdf
    source:
      kind: geotiff_noas04_class_membership
      path: geodata/external/labes_rasters/noas04_landuse_codes_lv95.tif
      class_set: [11, 12, 13, 15, 16, 17]
      calibration_note: "Empirically calibrated against BAFU per-biogeoregion 2009 totals; fit error ±6.4% per region."
    join_method: raster_point_sample
    granularity: raster_pixel
    value_unit: binary_0_1
    value_range: [0, 1]
    year_latest: 2018
    reference_values:
      national_mean: null
      biogeoregion_means: # converted from k_ha to % area using bioregion totals
        jura: 8.64
        mittelland: 16.80
        alpennordflanke: 7.39
        westliche_zentralalpen: 2.68
        oestliche_zentralalpen: 1.52
        alpensuedflanke: 3.61
    implementation_status: implemented

  - ind_id: "4"
    column_name: labes_ind4_verkehr_flaeche_laenge
    category: physical
    german_name: "Verkehr — Fläche und Länge"
    english_description: "Distance in metres from each manifest point to the nearest transport infrastructure line (roads and railways), 2020. Source: TLM_Liniennetz_9a (combined road/rail network) from LABES 9."
    bafu_pdf: geodata/LABES/labes_4_verkehrflaechelaenge/Auswertungsprotokoll_LABES_4_VerkehrFlaecheLaenge.pdf
    source:
      kind: gdb_line_features
      path: geodata/LABES/labes_9_zerschneidung/LABES_9_GIS/LABES_9_Zerschneidung_2020.gdb
      layer: TLM_Liniennetz_9a
    join_method: nearest_feature_distance
    granularity: nearest_feature
    value_unit: m
    value_range: [0, null]
    year_latest: 2020
    reference_values:
      national_mean: null
      biogeoregion_means_ha: # preserved as cross-reference for the original area publication
        jura: 5961.575608
        mittelland: 25889.092132
        alpennordflanke: 8384.614481
        westliche_zentralalpen: 2509.739984
        oestliche_zentralalpen: 1713.706148
        alpensuedflanke: 2743.088124
    implementation_status: implemented

  - ind_id: "7"
    column_name: labes_ind7_versiegelung
    category: physical
    german_name: "Versiegelung"
    english_description: |
      Soil sealing (Versiegelung). Per-pixel BINARY MASK from BAFU's LABES 7
      product: 1 = pixel is sealed, 0 = not sealed. BAFU derives this from the
      Arealstatistik NOAS04 land-use codes (a sealed-class lookup table is
      applied to each pixel; classes 1-12, 14-15, 19, etc. become 1, others
      become 0). The same NOAS04 code raster is available as the *_update
      subdataset in LV95. Per-biogeoregion total sealed area in ha is obtained
      by summing 1-pixels (each pixel = 1 ha) and matches the figures in
      LABES_7_Results.xlsx. Source raster: LABES_7_Versiegelung_1318_raster_r
      (LV03, 100 m).
    bafu_pdf: geodata/LABES/labes_7_versiegelung/Auswertungsprotokoll_LABES_7_Versiegelung.pdf
    source:
      kind: geotiff_extracted_from_gdb
      path: geodata/external/labes_rasters/labes_ind7_versiegelung_1318_lv03_mask.tif
      source_gdb: geodata/LABES/labes_7_versiegelung/LABES_7_GIS/LABES_7_Versiegelung.gdb
      source_subdataset: LABES_7_Versiegelung_1318_raster_r
    join_method: raster_point_sample
    granularity: raster_pixel
    value_unit: binary_0_1
    value_range: [0, 1]
    year_latest: 2018
    reference_values:
      national_mean: null
      biogeoregion_means: # converted from hectares to % area using bioregion totals
        jura: 4.95
        mittelland: 9.85
        alpennordflanke: 4.60
        westliche_zentralalpen: 2.41
        oestliche_zentralalpen: 2.28
        alpensuedflanke: 2.02
    implementation_status: implemented

  - ind_id: "8"
    column_name: labes_ind8_bauen_ausserhalb_bauzone
    category: physical
    german_name: "Bauen ausserhalb Bauzone"
    english_description: "Density of buildings outside official zoning, measured as a 12.5 m × 12.5 m raster; the value at a pixel reflects local building dispersion outside building zones (Bauzonen). BAFU's canonical 'new calculation' protocol."
    bafu_pdf: geodata/LABES/labes_8_bauen_ausserhalb_bauzone_neue_berechnung/Auswertungsprotokoll_LABES_8_Bauen_ausserhalb_Bauzone_neue_Berechnung.pdf
    source:
      kind: arcinfo_grid
      path: geodata/LABES/labes_8_bauen_ausserhalb_bauzone_neue_berechnung/LABES_8_GIS/LABES_8_Bauen_ausserhalb_Bauzone_neue_Berechnung_grids/edr12_5_20i
      crs_assumed: EPSG:2056   # confirm from .prj if present
    join_method: raster_point_sample
    granularity: raster_pixel
    coverage_null_threshold: 0.15
    value_unit: index  # see PDF for exact units
    value_range: [0, null]
    year_latest: 2020
    reference_values:
      national_mean: null
      biogeoregion_means: null
    implementation_status: implemented

  - ind_id: "9"
    column_name: labes_ind9_zerschneidung
    category: physical
    german_name: "Zerschneidung (effektive Maschenweite)"
    english_description: "Landscape fragmentation expressed as the effective mesh size (Meff, km²) per biogeoregion, 2020. Source: BAFU LABES 9a (with elevation-barrier above 2100 m). The first-row Meff value from each per-biogeoregion sheet of LABES_Zerschneidung_9a_corr.xlsx; values reproduce BAFU's published per-biogeoregion Meff exactly."
    bafu_pdf: geodata/LABES/labes_9_zerschneidung/Auswertungsprotokoll_LABES_9_Zerschneidung.pdf
    source:
      kind: bafu_published_biogeoregion
      path: geodata/LABES/labes_9_zerschneidung/LABES_9_Results/LABES_Zerschneidung_9a_corr.xlsx
      note: "Meff per biogeoregion from sheets JURA_20, MITTELLAND_20, ALPENNORD_20, WESTALPEN_20, OSTALPEN_20, ALPENSUD_20 (first row, column 'meff '). National (SCHWEIZ_20) = 229.03 km²."
    join_method: spec_biogeoregion_values
    granularity: biogeoregion
    value_unit: km2
    value_range: [0, null]
    year_latest: 2020
    reference_values:
      national_mean: 229.03
      biogeoregion_means:
        jura: 17.48
        mittelland: 2.68
        alpennordflanke: 332.69
        westliche_zentralalpen: 255.13
        oestliche_zentralalpen: 216.10
        alpensuedflanke: 449.18
    implementation_status: implemented

  - ind_id: "11a"
    column_name: labes_ind11a_veraenderung_fliessgewaesser
    category: physical
    german_name: "Veränderung Fliessgewässer"
    english_description: "Change in flowing-waters character over time, derived from BAFU's sample-based monitoring (118 monitoring sites). Per-biogeoregion aggregate is the only spatially varying form published."
    bafu_pdf: geodata/LABES/labes_11_gewaesser/Auswertungsprotokoll_LABES_11a_Veraenderung_Fliessgewaesser.pdf
    source:
      kind: xlsx_biogeoregion
      path: geodata/LABES/labes_11_gewaesser/LABES_11_Results/LABES_11_Results.xlsx
      sheet: diff FLIESS
      cell: C5  # "Differenz" for BP 2015-2020, km/year
    join_method: xlsx_national_constant
    granularity: national
    value_unit: km_per_year
    value_range: [0, null]
    year_latest: 2020
    reference_values: { national_mean: 21.5, biogeoregion_means: null }
    implementation_status: implemented

  - ind_id: "11b"
    column_name: labes_ind11b_veraenderung_stehende_gewaesser
    category: physical
    german_name: "Veränderung stehende Gewässer"
    english_description: "Change in standing-waters character over time, BAFU sample-based monitoring."
    bafu_pdf: geodata/LABES/labes_11_gewaesser/Auswertungsprotokoll_LABES_11b_Veraenderung_stehendeGewaesser.pdf
    source:
      kind: xlsx_biogeoregion
      path: geodata/LABES/labes_11_gewaesser/LABES_11_Results/LABES_11_Results.xlsx
      sheet: diff STEHENDE
      cell: C5  # "Differenz" for BP 2015-2020, ha/year
    join_method: xlsx_national_constant
    granularity: national
    value_unit: ha_per_year
    value_range: [0, null]
    year_latest: 2020
    reference_values: { national_mean: 0.6, biogeoregion_means: null }
    implementation_status: implemented

  - ind_id: "14"
    column_name: labes_ind14_licht
    category: physical
    german_name: "Lichtemissionen"
    english_description: |
      Night-light emissions per pixel. Uses BAFU's own LABES 14 VCMSL product
      (VIIRS Composite Masked Stable Lights, DMSP-equivalent rescaling for
      time-series continuity), extracted from the BAFU FileGDB at 1000m LV03.
      An independent NOAA EOG 500m VIIRS DNB annual composite covering CH
      (geodata/external/viirs_dnb_npp_2020_switzerland_wgs84.tif) is also
      available as a higher-resolution cross-source; we prefer BAFU's product
      here for academic alignment with the LABES 14 published statistics.
    bafu_pdf: geodata/LABES/labes_14_licht/Auswertungsprotokoll_LABES_14_Licht.pdf
    source:
      kind: geotiff_extracted_from_gdb
      path: geodata/external/labes_rasters/labes_ind14_licht_2020_lv03_500m.tif
      source_gdb: geodata/LABES/labes_14_licht/LABES_14_GIS/LABES_14_Licht_VCMSL.gdb
      source_subdataset: VIIRS_500m_LV03_2020_mask
      alternative_dmsp_rescaled: geodata/external/labes_rasters/labes_ind14_licht_2020_lv03_likeDMSP.tif
      alternative_noaa_eog: geodata/external/viirs_dnb_npp_2020_switzerland_wgs84.tif
    join_method: raster_point_sample
    granularity: raster_pixel
    value_unit: nW_cm2_sr
    value_range: [0, null]
    year_latest: 2020
    reference_values:
      national_mean: null
      biogeoregion_means: null
    implementation_status: implemented

  - ind_id: "15"
    column_name: labes_ind15_naturueberlassene_flaeche
    category: physical
    german_name: "Naturüberlassene Fläche"
    english_description: |
      Area left to natural development (alpine wilderness / nature-overlooked).
      Per-pixel BINARY mask (0/1) at 1 ha LV95 from the BAFU FileGDB raster
      `NOAS04_18_alpine_raster_recl_update`. Value 1 = pixel classified as
      'naturüberlassen' under BAFU's NOAS04-2018 derivation. The biogeoregion
      total in 1000 ha is also published in the LFI Auswertung_Waldwildnis.xlsx
      for cross-reference.
    bafu_pdf: geodata/LABES/labes_15_naturuberlasseneflache/Auswertungsprotokoll_LABES_15_NaturueberlasseneFlache.pdf
    source:
      kind: geotiff_extracted_from_gdb
      path: geodata/external/labes_rasters/labes_ind15_naturueberlassene_18_lv95.tif
      source_gdb: geodata/LABES/labes_15_naturuberlasseneflache/LABES_15_GIS/LABES_15_NaturuberlasseneFlache.gdb
      source_subdataset: NOAS04_18_alpine_raster_recl_update
    join_method: raster_point_sample
    granularity: raster_pixel
    value_unit: binary_0_1
    value_range: [0, 1]
    year_latest: 2020
    reference_values:
      national_mean: null
      biogeoregion_means: # converted from k_ha to % area using bioregion totals
        jura: 0.23
        mittelland: 0.035
        alpennordflanke: 3.07
        westliche_zentralalpen: 2.63
        oestliche_zentralalpen: 2.13
        alpensuedflanke: 11.64
    implementation_status: implemented

  - ind_id: "17a"
    column_name: labes_ind17a_soemmerungsweiden
    category: physical
    german_name: "Sömmerungsweiden"
    english_description: |
      Summer alpine pastures from the official BFS Arealstatistik point lattice
      (`ch.bfs.arealstatistik`, EPSG:2056) at native 100m (1 ha) resolution.
      Per BAFU protocol (indicator 17a), Sömmerungsweiden are NOAS04 72-category
      classes 45..49 (Alpwiesen, günstige/verbuschte/versteinte Alp- und
      Juraweiden, Schafalpen). Values are emitted as 0 or 100 per sampled point.
    bafu_pdf: geodata/LABES/labes_17a_soemmerungsweiden/Auswertungsprotokoll_LABES_17a_Soemmerungsweiden.pdf
    source:
      kind: bfs_arealstatistik_point_csv
      path: geodata/external/arealstatistik/arealstatistik_2056.csv.zip
      easting_column: E_COORD
      northing_column: N_COORD
      class_column: AS_72
      class_set: [45, 46, 47, 48, 49]
      grid_size_m: 100
      value_scale: 100
      note: "BAFU 17a protocol uses Arealstatistik NOAS04 (72 categories), classes 45..49."
    join_method: arealstatistik_point_sample
    granularity: raster_pixel
    value_unit: pct
    value_range: [0, 100]
    year_latest: 2018
    reference_values:
      national_mean: null
      biogeoregion_means: # converted from k_ha to % area using bioregion totals
        jura: 10.06
        mittelland: 0.059
        alpennordflanke: 30.75
        westliche_zentralalpen: 9.20
        oestliche_zentralalpen: 20.83
        alpensuedflanke: 6.24
    implementation_status: implemented

  - ind_id: "31a"
    column_name: labes_ind31a_gewaesserabschnitte_frei_begehbar
    category: physical
    german_name: "Gewässerabschnitte frei begehbar"
    english_description: |
      Distance in metres from each manifest point to the nearest freely-walkable
      water-edge segment (Bäche, Flüsse, See-Ufer). Source: 1,213,085 LineString
      features in the BAFU LABES 31a shapefile gew_inreg_2020.shp. Per-point
      true-distance gives finer signal than the biogeoregion km/km² density that
      BAFU also publishes (those per-biogeoregion totals remain in
      reference_values for cross-reference).
    bafu_pdf: geodata/LABES/labes_31a_gewaesserabschnitte_frei_begehbar/Auswertungsprotokoll_LABES_31a_Gewaesserabschnitte_frei_begehbar.pdf
    source:
      kind: shapefile_line_features
      path: geodata/LABES/labes_31a_gewaesserabschnitte_frei_begehbar/LABES_31a_GIS/LABES_31a_Gewaesserabschnitte_frei_begehbar_shapes/gew_inreg_2020.shp
    join_method: nearest_feature_distance
    granularity: nearest_feature
    value_unit: m
    value_range: [0, null]
    year_latest: 2020
    reference_values:
      national_mean: null
      biogeoregion_means_km_per_km2:  # FYI; per-biogeoregion published density (different unit)
        jura: 0.872
        mittelland: 1.789
        alpennordflanke: 2.450
        westliche_zentralalpen: 1.657
        oestliche_zentralalpen: 2.000
        alpensuedflanke: 2.212
    implementation_status: implemented

  - ind_id: "32"
    column_name: labes_ind32_anlagefrei
    category: physical
    german_name: "Anlagefrei"
    english_description: |
      Per-pixel installation-density CLASS at 500m LV95 from BAFU LABES 32
      classed raster (LABES_32_LV95_2020_classed). Values follow BAFU's
      published 4-category classification: 1 = völlig anlagefrei (0%
      installations), 2 = vereinzelte Anlagen (0.1-5%), 3 = wenige Anlagen
      (5.1-10%), 4 = viele Anlagen (>10%). Per-biogeoregion shares of each
      category are also published in LABES_32_Statistik.xlsx.
    bafu_pdf: geodata/LABES/labes_32_anlagefrei/Auswertungsprotokoll_LABES_32_Anlagefrei.pdf
    source:
      kind: geotiff_extracted_from_gdb
      path: geodata/external/labes_rasters/labes_ind32_anlagefrei_2020_lv95_classed.tif
      source_gdb: geodata/LABES/labes_32_anlagefrei/LABES_32_GIS/LABES_32_Anlagefreie_2020.gdb
      source_subdataset: LABES_32_LV95_2020_classed
